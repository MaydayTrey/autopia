<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Autopia Compendium</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e4e4e4; --accent:#1f5fbf; --warn:#b3261e; --warnbg:#fdecea; --okbg:#eef7ee; --code:#f4f4f4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --muted:#9a9a9a; --line:#2a2a2a; --accent:#7fb0ff; --warn:#ff8a80; --warnbg:#3a1a18; --okbg:#16301a; --code:#1c1c1c; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap }
  header h1 { font-size:17px; margin:0 }
  main { padding:16px; max-width:1100px; margin:0 auto }
  select, input, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg) }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px }
  .muted { color:var(--muted) }
  .claim { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin:8px 0 }
  .claim.div { border-color:var(--warn); background:var(--warnbg) }
  .kind { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted) }
  .tag { display:inline-block; font-size:12px; padding:1px 7px; border-radius:999px; background:var(--okbg); margin-left:6px }
  .tag.div { background:var(--warn); color:#fff }
  details summary { cursor:pointer; color:var(--accent); font-size:13px; margin-top:6px }
  pre { background:var(--code); padding:8px; border-radius:6px; overflow:auto; font-size:12px; margin:6px 0 }
  h2 { font-size:15px; margin:18px 0 6px }
  .diff .changed { color:var(--warn) }
  @media (max-width:600px){ main{padding:12px} }
</style>
</head>
<body>
<header>
  <h1>Autopia Compendium</h1>
  <span class="muted">verified, versioned API behavior with receipts</span>
</header>
<main>
  <div class="row">
    <label>Tool <select id="tool"></select></label>
    <label>Version <select id="version"></select></label>
    <label><input type="checkbox" id="divOnly" /> divergences only</label>
    <input id="q" placeholder="search claims, e.g. is latitude required" size="32" />
    <button id="go">Search</button>
  </div>
  <div id="summary" class="muted"></div>
  <div id="out"></div>
  <h2>Version diff</h2>
  <div class="row">
    <label>from <select id="from"></select></label>
    <label>to <select id="to"></select></label>
    <button id="diffBtn">Diff</button>
  </div>
  <div id="diff" class="diff"></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = (p) => fetch(p).then((r) => r.json());

async function loadTools() {
  const tools = await api('/api/tools');
  $('#tool').innerHTML = tools.map((t) => `<option value="${esc(t.name)}">${esc(t.name)} (${t.verified_claims} claims, ${t.divergences} divergences)</option>`).join('');
  await loadVersions();
}
async function loadVersions() {
  const name = $('#tool').value;
  if (!name) return;
  const vs = await api(`/api/tools/${encodeURIComponent(name)}/versions`);
  const opts = vs.map((v) => `<option value="${v.id}">#${v.id} ${esc(v.versionLabel ?? '')} ${esc(String(v.specHash).slice(0, 10))}</option>`).join('');
  $('#version').innerHTML = opts; $('#from').innerHTML = opts; $('#to').innerHTML = opts;
  if (vs.length > 1) $('#from').value = vs[1].id;
  await loadClaims();
}
function renderClaims(claims) {
  if (!claims.length) return '<p class="muted">no claims</p>';
  return claims.map((c) => `
    <div class="claim ${c.diverges_from_spec ? 'div' : ''}">
      <div class="kind">${esc(c.kind)} · ${esc(c.endpoint)}${c.param ? ' · ' + esc(c.param) : ''} · ${esc(c.source)} · conf ${c.confidence}
        <span class="tag ${c.diverges_from_spec ? 'div' : ''}">${c.diverges_from_spec ? 'DIVERGES FROM SPEC' : 'verified'}</span></div>
      <div>${esc(c.statement)}</div>
      ${c.spec_says ? `<div class="muted">spec says: ${esc(c.spec_says)}</div>` : ''}
      <details><summary>evidence (${c.evidence.length} trials)</summary>
        ${c.evidence.map((e) => `<pre>#${e.id} ${esc(e.mutation_id)} → HTTP ${e.status ?? 'none'} (${e.latency_ms}ms)\n${esc(e.request.method)} ${esc(e.request.url)}${e.request.query.length ? '?' + esc(e.request.query.map(([k, v]) => k + '=' + v).join('&')) : ''}\n${esc(JSON.stringify(e.response_preview).slice(0, 400))}</pre>`).join('')}
      </details>
    </div>`).join('');
}
async function loadClaims() {
  const name = $('#tool').value; const v = $('#version').value;
  const k = await api(`/api/tools/${encodeURIComponent(name)}/claims?version=${v}&divergences=${$('#divOnly').checked ? 1 : 0}`);
  $('#summary').textContent = `${k.claims.length} claims · run #${k.run_id ?? '-'} · spec ${k.version?.spec_url ?? ''}`;
  $('#out').innerHTML = renderClaims(k.claims);
}
async function search() {
  const q = $('#q').value.trim(); if (!q) return loadClaims();
  const hits = await api(`/api/search?q=${encodeURIComponent(q)}&tool=${encodeURIComponent($('#tool').value)}`);
  $('#summary').textContent = `${hits.length} hits for "${q}"`;
  $('#out').innerHTML = renderClaims(hits);
}
async function diff() {
  const d = await api(`/api/tools/${encodeURIComponent($('#tool').value)}/diff?from=${$('#from').value}&to=${$('#to').value}`);
  $('#diff').innerHTML = `<p>${esc(JSON.stringify(d.counts))}</p>` + d.changes.map((c) => `<div class="claim"><div class="kind ${c.change}">${esc(c.change)} · ${esc(c.claim_key)}</div><div class="muted">before: ${esc(c.before?.statement ?? '-')}</div><div>after: ${esc(c.after?.statement ?? '-')}</div></div>`).join('');
}
$('#tool').onchange = loadVersions; $('#version').onchange = loadClaims; $('#divOnly').onchange = loadClaims;
$('#go').onclick = search; $('#q').onkeydown = (e) => { if (e.key === 'Enter') search(); }; $('#diffBtn').onclick = diff;
loadTools();
</script>
</body>
</html>
