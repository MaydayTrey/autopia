# NIGHTLY refresh, rules only: re-fetch every spec, re-exercise, re-verify, diff, then prune.
# No model cost. The previous run's LLM claims are carried forward and re-verified each night.
# Needs repository secret DATABASE_URL (Neon direct URL). Also runnable by hand.
name: run-all
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run run-all -- --no-llm --prune-days 14
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built-in Actions token: lets targets/github-rest.json re-verify nightly (1,000 req/h)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # for targets/anthropic-api.json (read-only models endpoints), not for the LLM pass here
          AUTOPIA_LOG: info
