# Nightly refresh of the compendium: re-fetch every spec, re-exercise, re-verify, diff.
# Free on GitHub Actions. Needs repository secrets DATABASE_URL (Neon direct URL) and,
# for the LLM pass, ANTHROPIC_API_KEY. Also runnable by hand from the Actions tab.
name: run-all
on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:
jobs:
  run-all:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run run-all
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTOPIA_LOG: info
